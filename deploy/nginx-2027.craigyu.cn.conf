# 2027.craigyu.cn — 2027 Strategy 私测部署
# 源站: 127.0.0.1:3317 (Hono API + 已构建的 React SPA)
# Cloudflare 代理在前；80 端口承担 ACME 校验与纯 HTTP 回源。
# 证书: Let's Encrypt (certbot, 自动续期)

server {
    listen 80;
    listen [::]:80;
    server_name 2027.craigyu.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/craigyu-home;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 2027.craigyu.cn;

    ssl_certificate     /etc/letsencrypt/live/2027.craigyu.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/2027.craigyu.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300;
    }
}
